<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF6EB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gambar Orang" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="description" content="Gambar orang langkah demi langkah — untuk anak TK, iPad & stylus." />
  <title>Gambar Orang — Langkah demi langkah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Language">EN</button>

  <!-- Title -->
  <section class="screen active" id="screen-title" aria-label="Title">
    <div class="logo-mark" aria-hidden="true">✏️</div>
    <h1 data-i18n="title">Gambar Orang</h1>
    <p class="subtitle" data-i18n="subtitle">Langkah demi langkah</p>
    <button type="button" class="btn-primary" id="btn-start" data-i18n="start">Mulai!</button>
  </section>

  <!-- Character pick -->
  <section class="screen" id="screen-pick" aria-label="Pick character">
    <div class="screen-header">
      <button type="button" class="btn-ghost" id="btn-back-pick" data-i18n="back">Kembali</button>
      <h2 data-i18n="pickTitle">Pilih teman</h2>
    </div>
    <div class="char-grid" id="char-grid"></div>
  </section>

  <!-- Play -->
  <section class="screen" id="screen-play" aria-label="Play">
    <div class="play-top">
      <button type="button" class="btn-ghost" id="btn-back-play" data-i18n="back">Kembali</button>
      <span class="step-badge" id="step-badge">Langkah 1/9</span>
      <span class="step-label" id="step-label">Kepala · Dagu</span>
      <span class="stroke-badge" id="stroke-badge">garis 1/4</span>
      <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game-canvas" width="800" height="1000"></canvas>
      <div class="feedback-toast" id="feedback-toast" role="status"></div>
    </div>

    <div class="play-bottom">
      <span class="hint-trace" id="hint-trace">Ikuti garis putus-putus ✎</span>
      <span class="region-hint" id="region-hint"></span>
      <div class="palette" id="palette"></div>
      <button type="button" class="btn-secondary" id="btn-undo" data-i18n="undo">Hapus goresan</button>
      <button type="button" class="btn-primary" id="btn-done-color" data-i18n="selesaiWarnai" style="display:none">Selesai</button>
    </div>

    <div class="overlay" id="overlay-done">
      <div class="stars" aria-hidden="true">⭐⭐⭐</div>
      <h2 id="done-title">Hebat!</h2>
      <p id="done-sub">Gambarmu sudah jadi.</p>
      <div class="overlay-actions">
        <button type="button" class="btn-primary" id="btn-gambar-lagi" data-i18n="gambarLagi">Gambar lagi</button>
        <button type="button" class="btn-secondary" id="btn-ganti" data-i18n="gantiKarakter">Ganti karakter</button>
      </div>
    </div>
  </section>

  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
